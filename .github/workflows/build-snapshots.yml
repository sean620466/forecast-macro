name: Build historical snapshots
# Builds the complete point-in-time range with throttled FRED requests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-snapshots.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Build point-in-time data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python scripts/build_fomc_snapshots.py
          --meetings data/fomc_meetings_2019_2024.csv
          --output artifacts/fomc_feature_snapshots_2019_2024.json
      - uses: actions/upload-artifact@v4
        with:
          name: fomc-feature-snapshots-2019-2024
          path: artifacts/fomc_feature_snapshots_2019_2024.json
