name: Build historical snapshots
# Builds the complete point-in-time range with throttled FRED requests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-snapshots.yml"
      - "scripts/build_fomc_snapshots.py"
      - "src/forecast_macro/snapshots.py"
      - "src/forecast_macro/data/alfred.py"
      - "data/fomc_meetings_2015_2026.csv"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Build point-in-time data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python scripts/build_fomc_snapshots.py
          --meetings data/fomc_meetings_2015_2026.csv
          --output artifacts/fomc_feature_snapshots_2015_2026.json
          --first-release-dates
      - uses: actions/upload-artifact@v4
        with:
          name: fomc-feature-snapshots-2015-2026
          path: artifacts/fomc_feature_snapshots_2015_2026.json
      - name: Persist snapshots in the repository
        # The 2019-2024 and 2019-2026 files stay untouched so their regression tests keep their fixtures.
        run: |
          # Commit only when the data changed; build time and commit hash alone do not count.
          python - <<'PY'
          import json, pathlib, sys
          new = json.load(open("artifacts/fomc_feature_snapshots_2015_2026.json"))
          target = pathlib.Path("data/generated/fomc_feature_snapshots_2015_2026.json")
          def strip(rows):
              return [{k: v for k, v in row.items() if k != "provenance"} for row in rows]
          if target.exists() and strip(json.load(target.open())) == strip(new):
              print("snapshot data unchanged; not committing")
              sys.exit(0)
          target.write_text(json.dumps(new, indent=2) + "\n")
          PY
          git config user.name "forecast-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/fomc_feature_snapshots_2015_2026.json
          if git diff --cached --quiet; then
            echo "snapshots unchanged"
            exit 0
          fi
          git commit -m "Record point-in-time FOMC feature snapshots 2019-2026 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
