name: Compare Fed model with market

on:
  workflow_dispatch:
    inputs:
      verify_statement_fetch:
        description: "Also fetch the last labelled FOMC statement and check the parser against its row (task 48 self-test)"
        type: boolean
        default: false
  schedule:
    - cron: "40 13 * * 1-5"  # weekdays after the 08:30 ET releases have settled
  push:
    branches: [main]
    paths:
      - ".github/workflows/compare-fed-market.yml"
      - "scripts/compare_fed_market.py"
      - "scripts/score_fed_comparisons.py"
      - "scripts/record_fomc_decisions.py"
      - "src/forecast_macro/fomc_decisions.py"
      - "src/forecast_macro/datasets.py"
      - "src/forecast_macro/comparison_scoring.py"
      - "scripts/compare_unemployment_market.py"
      - "src/forecast_macro/unemployment_comparison.py"
      - "src/forecast_macro/models/unemployment.py"
      - "scripts/score_unemployment_comparisons.py"
      - "src/forecast_macro/unemployment_scoring.py"
      - "scripts/build_dashboard.py"
      - "scripts/compare_core_cpi_market.py"
      - "scripts/score_core_cpi_comparisons.py"
      - "src/forecast_macro/models/core_cpi.py"
      - "src/forecast_macro/unemployment_scoring.py"
      - "src/forecast_macro/live_comparison.py"
      - "src/forecast_macro/snapshots.py"
      - "src/forecast_macro/data/alfred.py"
      - "scripts/scoring_alerts.py"
      - "scripts/check_release_schedule.py"
      - "data/release_schedule.csv"
      - "src/forecast_macro/alerts.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: compare-fed-market
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Check that the transcribed release calendar reaches 45 days ahead (R7-M1)
        run: python scripts/check_release_schedule.py
      - name: Record model vs market for the next FOMC decision
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/compare_fed_market.py
      - name: Record unemployment bucket baseline vs market
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/compare_unemployment_market.py
      - name: Record Core CPI YoY bucket baseline vs market
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/compare_core_cpi_market.py
      - name: Record headline CPI YoY bucket baseline vs market (Kalshi KXCPIYOY)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/compare_core_cpi_market.py --measure headline
      - name: Record realized FOMC decisions from the decision press release (task 48)
        # continue-on-error so the day's comparisons are still scored and persisted; the last
        # step turns a failure here into a red run, which alerts.yml reports as an issue.
        id: decisions
        continue-on-error: true
        run: |
          if [ "${{ inputs.verify_statement_fetch }}" = "true" ]; then
            python scripts/record_fomc_decisions.py --verify-last
          fi
          python scripts/record_fomc_decisions.py
      - name: Score past comparisons against realized decisions (D-007)
        run: python scripts/score_fed_comparisons.py
      - name: Score Core CPI comparisons against first-published YoY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/score_core_cpi_comparisons.py
      - name: Score headline CPI comparisons against first-published YoY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/score_core_cpi_comparisons.py --measure headline
      - name: Score unemployment comparisons against first-published rates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/score_unemployment_comparisons.py
      - name: Build the status dashboard and STATUS.md
        run: python scripts/build_dashboard.py
      - name: Detect newly scored outcomes (compared with the committed scoring files)
        run: python scripts/scoring_alerts.py --ref HEAD --output-dir artifacts/alerts
      - name: Open one issue per newly scored topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for file in artifacts/alerts/*.md; do
            title=$(head -n 1 "$file")
            tail -n +2 "$file" > /tmp/alert_body.md
            gh label create scoring --color 0E8A16 --description "A realized outcome was scored" --force
            gh issue create --title "$title" --label scoring --body-file /tmp/alert_body.md
          done
      - name: Persist comparison in the repository
        run: |
          git config user.name "forecast-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          # A topic with no priced market yet has no directory; git add must not fail on it (run #18).
          for path in data/generated/fed_market_comparisons data/generated/fed_market_scoring.json \
                      data/generated/fomc_decisions.csv \
                      data/generated/unemployment_market_comparisons data/generated/unemployment_market_scoring.json \
                      data/generated/core_cpi_market_comparisons data/generated/core_cpi_market_scoring.json \
                      data/generated/headline_cpi_market_comparisons data/generated/headline_cpi_market_scoring.json \
                      docs/dashboard/index.html STATUS.md; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "no new comparison"
            exit 0
          fi
          git commit -m "Record model vs market comparisons $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail the run when a realized FOMC decision could not be recorded
        if: steps.decisions.outcome == 'failure'
        run: |
          echo "record_fomc_decisions.py failed; the D-007 scoring for that meeting is blocked until the"
          echo "statement is recorded (docs/FOMC_DATASET.md, 'Realized decisions')."
          exit 1
