name: Backtest CPI baselines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cpi-baselines.yml"
      - "scripts/backtest_cpi_baselines.py"
      - "src/forecast_macro/cpi_backtest.py"
      - "src/forecast_macro/models/cpi_base_effect.py"
      - "src/forecast_macro/models/core_cpi.py"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Run the research backtest on published NSA index levels
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/backtest_cpi_baselines.py
      - name: Persist the result
        run: |
          git config user.name "forecast-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          # Commit only when the scores changed; the build timestamp alone does not count.
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open("data/generated/cpi_baseline_backtest.json"))
          old = subprocess.run(["git", "show", "HEAD:data/generated/cpi_baseline_backtest.json"], capture_output=True, text=True)
          if old.returncode == 0:
              previous = json.loads(old.stdout)
              if previous.get("measures") == new.get("measures") and previous.get("vintage") == new.get("vintage"):
                  subprocess.run(["git", "checkout", "--", "data/generated/cpi_baseline_backtest.json"], check=True)
                  print("backtest unchanged; not committing")
                  sys.exit(0)
          PY
          git add data/generated/cpi_baseline_backtest.json
          if git diff --cached --quiet; then
            echo "backtest unchanged"
            exit 0
          fi
          git commit -m "Record CPI baseline backtest $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
