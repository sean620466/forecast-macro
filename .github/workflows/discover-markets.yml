name: Discover macro markets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-markets.yml"
      - "scripts/discover_macro_markets.py"
      - "scripts/verify_market_rules.py"
      - "src/forecast_macro/market_discovery.py"
      - "src/forecast_macro/market_review.py"
      - "src/forecast_macro/market_rules.py"
      - "src/forecast_macro/data/polymarket.py"
      - "src/forecast_macro/price_snapshots.py"
      - "scripts/snapshot_market_prices.py"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Discover review candidates
        run: python scripts/discover_macro_markets.py --output artifacts/macro_market_candidates.json
      - name: Fetch and verify versioned contract rules
        run: |
          python scripts/verify_market_rules.py \
            --input artifacts/macro_market_candidates.json \
            --output artifacts/macro_market_review.json
      - name: Snapshot prices for fully approved events
        run: |
          python scripts/snapshot_market_prices.py \
            --candidates artifacts/macro_market_candidates.json \
            --review artifacts/macro_market_review.json \
            --output-dir artifacts/prices
      - uses: actions/upload-artifact@v4
        with:
          name: macro-market-review
          path: artifacts/
          retention-days: 14
