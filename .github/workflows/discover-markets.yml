name: Discover macro markets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-markets.yml"
      - "scripts/discover_macro_markets.py"
      - "scripts/verify_market_rules.py"
      - "src/forecast_macro/market_discovery.py"
      - "src/forecast_macro/market_review.py"
      - "src/forecast_macro/market_rules.py"
      - "src/forecast_macro/data/polymarket.py"
      - "src/forecast_macro/price_snapshots.py"
      - "scripts/snapshot_market_prices.py"

permissions:
  contents: write

concurrency:
  group: discover-markets
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Discover review candidates
        run: python scripts/discover_macro_markets.py --output artifacts/macro_market_candidates.json
      - name: Fetch and verify versioned contract rules
        run: |
          python scripts/verify_market_rules.py \
            --input artifacts/macro_market_candidates.json \
            --output artifacts/macro_market_review.json
      - name: Snapshot prices for fully approved events
        run: |
          python scripts/snapshot_market_prices.py \
            --candidates artifacts/macro_market_candidates.json \
            --review artifacts/macro_market_review.json \
            --output-dir artifacts/prices
      - uses: actions/upload-artifact@v4
        with:
          name: macro-market-review
          path: artifacts/
          retention-days: 14
      - name: Persist price snapshots in the repository (R8-L2)
        # Each run appends its snapshot files; nothing is rewritten, so history is auditable.
        # [skip ci] keeps the data commit from re-triggering the test workflow.
        run: |
          mkdir -p data/generated/market_prices
          cp artifacts/prices/*.json data/generated/market_prices/ 2>/dev/null || true
          cp artifacts/macro_market_review.json data/generated/macro_market_review_latest.json
          cp artifacts/macro_market_candidates.status.json data/generated/macro_market_discovery_status_latest.json 2>/dev/null || true
          git config user.name "forecast-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated/market_prices data/generated/macro_market_review_latest.json data/generated/macro_market_discovery_status_latest.json
          if git diff --cached --quiet; then
            echo "no new snapshot data"
            exit 0
          fi
          git commit -m "Record market price snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
