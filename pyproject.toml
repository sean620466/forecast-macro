[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-macro"
version = "0.1.0"
description = "Macroeconomic probability models and prediction-market signal engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
forecast-macro = "forecast_macro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_macro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
